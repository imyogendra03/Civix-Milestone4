<div class="layout">
    <app-navbar [sidenavOpened]="opened()" (toggleSidenav)="toggle()"></app-navbar>
    <mat-sidenav-container class="container" [hasBackdrop]="isMobile()">
      <mat-sidenav
        [opened]="opened()"
        [mode]="isMobile() ? 'over' : 'side'"
        class="sidenav">
        <app-sidebar></app-sidebar>
      </mat-sidenav>
      <mat-sidenav-content class="content">
        <router-outlet></router-outlet>
      </mat-sidenav-content>
    </mat-sidenav-container>
    </div>
